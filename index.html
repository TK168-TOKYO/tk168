<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>TK168 交车看板</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TK168">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#185fa5">
<script src="config.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;background:#f4f5f7;color:#1d1d1f;font-size:15px}
header{position:sticky;top:0;z-index:5;background:#185fa5;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;gap:8px}
header h1{font-size:17px;margin:0;flex:1}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:13px}
main{padding:12px 12px 90px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:13px;color:#777}
nav button.on{color:#185fa5;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.chip{flex:none;border:1px solid #cfd6de;background:#fff;border-radius:16px;padding:5px 11px;font-size:13px}
.chip.on{background:#185fa5;color:#fff;border-color:#185fa5}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid #e3e6ea}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.t{font-weight:700;font-size:16px}
.m{color:#666;font-size:13px}
.badge{font-size:12px;padding:2px 8px;border-radius:10px;white-space:nowrap}
.b-red{background:#fcebeb;color:#a32d2d}.b-org{background:#faeeda;color:#854f0b}.b-gray{background:#eef0f2;color:#555}.b-green{background:#eaf3de;color:#3b6d11}
.steps{display:flex;gap:4px;margin:10px 0 4px}
.steps div{flex:1;height:6px;border-radius:3px;background:#e3e6ea}
.steps .done{background:#3b8a3b}.steps .cur{background:#378add}
.stl{display:flex;font-size:11px;color:#888}.stl span{flex:1;text-align:center}
input,select,textarea{width:100%;font-size:16px;padding:9px 10px;border:1px solid #cfd6de;border-radius:8px;background:#fff;font-family:inherit}
label{display:block;font-size:13px;color:#555;margin:10px 0 4px}
.req{color:#c0392b}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:13px;font-size:16px;background:#185fa5;color:#fff;margin-top:14px}
.btn.sec{background:#eef0f2;color:#333}
.sheet{position:fixed;inset:0;background:#f4f5f7;z-index:10;overflow-y:auto;padding:0 0 40px}
.sheet .in{padding:12px;max-width:720px;margin:0 auto}
.stage h3{font-size:15px;margin:16px 0 6px;display:flex;justify-content:space-between}
.item{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid #e3e6ea;border-radius:10px;padding:10px;margin-bottom:6px}
.item input{width:22px;height:22px;flex:none;margin:0}
.item.ok .tx{color:#888;text-decoration:line-through}
.who{font-size:11px;color:#999}
.warn{background:#fcebeb;color:#a32d2d;border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px}
.log{font-size:13px;border-bottom:1px solid #eee;padding:7px 0}
.log b{color:#185fa5}
.err{color:#c0392b;font-size:13px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:20}
.empty{text-align:center;color:#999;padding:40px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
const STAGES = [
  { n: '签约', items: ['合同已签', '定金/尾款情况已登记', '交车日已和客户确认', '客户加装/需求已登记'] },
  { n: '材料齐', items: ['材料已到并扫描', '材料表已放进盒子', '钥匙数量已确认（缺的已告知客户）', '过户/名义变更完成'] },
  { n: '整备', items: ['入库点检完成', '保养（机油、机滤等）完成'] },
  { n: '洗车验收', items: ['外观手摸无灰', '轮毂、排气管、踏板干净', '座椅缝无渣、无头发', '地毯已放好', '水渍/老化件已处理', '发动机舱表面干净', '验收照片已拍'] },
  { n: '交车', items: ['交车前销售自查', '材料盒交给客户', '钥匙交给客户', '交车完成'] }
];
const REQ_PREFIX = '需求：';

/* ---------- 后端调用：App 走 GAS 接口；没填接口地址时用浏览器模拟数据 ---------- */
const CFG = window.TK168_CONFIG || {};
const HAS_GAS = !!CFG.API_URL;
async function call(fn, ...args) {
  if (!HAS_GAS) {
    await new Promise(r => setTimeout(r, 80));
    return MOCK[fn](...args);
  }
  let r;
  try {
    r = await fetch(CFG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }) });
  } catch (e) { throw new Error('网络连接失败，请稍后再试'); }
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j.result;
}

/* ---------- 推送通知（OneSignal） ---------- */
const PUSH_ON = !!CFG.ONESIGNAL_APP_ID;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
const extId = name => 'tk' + Array.from(new TextEncoder().encode(name)).map(b => b.toString(16).padStart(2, '0')).join('');
window.OneSignalDeferred = window.OneSignalDeferred || [];
if (PUSH_ON) {
  const base = location.pathname.replace(/[^/]*$/, '');
  const s = document.createElement('script');
  s.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js'; s.defer = true;
  document.head.appendChild(s);
  OneSignalDeferred.push(async OS => {
    await OS.init({ appId: CFG.ONESIGNAL_APP_ID, serviceWorkerPath: base.slice(1) + 'OneSignalSDKWorker.js', serviceWorkerParam: { scope: base }, allowLocalhostAsSecureOrigin: true });
    OS.Notifications.addEventListener('permissionChange', () => render());
  });
}
function pushLogin(name) { if (PUSH_ON) OneSignalDeferred.push(OS => OS.login(extId(name))); }
function pushLogout() { if (PUSH_ON) OneSignalDeferred.push(OS => OS.logout()); }
function pushState() {
  if (!PUSH_ON) return 'off';
  if (isIOS && !isStandalone) return 'needHome';
  if (!('Notification' in window)) return 'unsupported';
  if (Notification.permission === 'granted') return 'on';
  if (Notification.permission === 'denied') return 'denied';
  return 'ask';
}
function pushCard() {
  const st = pushState();
  if (st === 'off' || st === 'on') return '';
  const msg = {
    needHome: '要收到通知：在 Safari 点底部「分享 → 添加到主屏幕」，然后从桌面图标打开 TK168。',
    unsupported: '这台手机的系统不支持网页 App 通知，请把 iPhone 升级到 iOS 16.4 以上。',
    denied: '通知被关掉了：请到 iPhone「设置 → 通知 → TK168」里打开。',
    ask: '开启通知后，有车分配给你、进入下一阶段、交车日临近时都会提醒你。'
  }[st];
  return `<div class="card" style="border-color:#85b7eb"><div class="t" style="font-size:15px">通知</div><div class="m" style="margin-top:4px">${msg}</div>${st === 'ask' ? '<button class="btn" id="pushBtn">开启通知</button>' : ''}</div>`;
}
function bindPush() {
  const b = $('pushBtn'); if (!b) return;
  b.onclick = () => OneSignalDeferred.push(async OS => {
    await OS.Notifications.requestPermission();
    OS.login(extId(S.me.name));
    render();
  });
}
const MOCK = (() => {
  const staff = [['小王','事务','1111'],['小孙','事务','2222'],['柳田','洗车','3333'],['小付','财务','4444'],['王哥','销售','5555'],['韩旭','销售','6666'],['老板','管理','0000']]
    .map(r => ({ name: r[0], role: r[1], pin: r[2] }));
  const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
  const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  let db = ld('tk168demo') || { cars: [], logs: [] };
  const auth = (n, p) => { const s = staff.find(x => x.name === n && x.pin === String(p)); if (!s) throw new Error('姓名或 PIN 不对'); return s; };
  return {
    staffNames: () => staff.map(s => ({ name: s.name, role: s.role })),
    login: (n, p) => { const s = auth(n, p); return { name: s.name, role: s.role }; },
    getAll: (n, p) => { auth(n, p); return JSON.parse(JSON.stringify({ cars: db.cars, logs: db.logs, staff: staff.map(s => ({ name: s.name, role: s.role })), now: Date.now() })); },
    saveCar: (n, p, car, logs) => {
      const me = auth(n, p);
      if (!car.model) throw new Error('车型必填');
      if (!car.deliveryDate) throw new Error('交车日必填');
      const i = db.cars.findIndex(c => c.id === car.id);
      if (car.id && i < 0) throw new Error('这辆车已被删除');
      if (i >= 0 && (db.cars[i].v || 0) !== (car.v || 0)) throw new Error('STALE');
      if (!car.id) { car.id = 'C' + Date.now().toString(36); car.createdAt = Date.now(); car.createdBy = me.name; }
      car.v = (car.v || 0) + 1; car.updatedAt = Date.now(); car.updatedBy = me.name;
      if (i >= 0) db.cars[i] = car; else db.cars.push(car);
      (logs || []).forEach(t => db.logs.push({ ts: Date.now(), user: me.name, carId: car.id, car: car.model, text: t }));
      sv('tk168demo', db);
      return JSON.parse(JSON.stringify(car));
    }
  };
})();

/* ---------- 状态 ---------- */
const S = { me: null, pin: '', cars: [], logs: [], staff: [], tab: 'board', filter: -1, q: '', open: null, edit: null, busy: false };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const fmtT = ts => { const d = new Date(ts); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1800); }

function stageIdx(car) {
  for (let i = 0; i < car.checklist.length; i++) if (car.checklist[i].items.some(x => !x.done)) return i;
  return STAGES.length;
}
function stageName(i) { return i >= STAGES.length ? '已交车' : STAGES[i].n; }
function daysLeft(car) { return Math.round((new Date(car.deliveryDate + 'T00:00:00') - today()) / 864e5); }
function dueBadge(car) {
  if (stageIdx(car) >= STAGES.length) return '<span class="badge b-green">已交车</span>';
  const d = daysLeft(car);
  if (d < 0) return `<span class="badge b-red">逾期 ${-d} 天</span>`;
  if (d === 0) return '<span class="badge b-red">今天交车</span>';
  if (d <= 2) return `<span class="badge b-org">还剩 ${d} 天</span>`;
  return `<span class="badge b-gray">还剩 ${d} 天</span>`;
}
function newChecklist(reqs) {
  return STAGES.map((s, i) => ({
    items: s.items.concat(i === 2 ? reqs.map(r => REQ_PREFIX + r) : []).map(t => ({ t, done: false }))
  }));
}
function syncReqs(car) {
  const st = car.checklist[2];
  const keep = st.items.filter(x => !x.t.startsWith(REQ_PREFIX));
  const old = {};
  st.items.filter(x => x.t.startsWith(REQ_PREFIX)).forEach(x => { old[x.t] = x; });
  st.items = keep.concat(car.reqs.map(r => old[REQ_PREFIX + r] || { t: REQ_PREFIX + r, done: false }));
}

/* ---------- 数据 ---------- */
async function load(silent) {
  try {
    const d = await call('getAll', S.me.name, S.pin);
    S.cars = d.cars; S.logs = d.logs; S.staff = d.staff;
    if (!S.open && !S.edit) render();
    else if (S.open && !S.edit) { const c = S.cars.find(x => x.id === S.open.id); if (c && c.v !== S.open.v) { S.open = c; render(); } }
  } catch (e) { if (!silent) toast(e.message || '加载失败'); }
}
async function save(car, logs) {
  car.stageName = stageName(stageIdx(car));
  try {
    const saved = await call('saveCar', S.me.name, S.pin, car, logs);
    const i = S.cars.findIndex(c => c.id === saved.id);
    if (i >= 0) S.cars[i] = saved; else S.cars.push(saved);
    logs.forEach(t => S.logs.push({ ts: Date.now(), user: S.me.name, carId: saved.id, car: saved.model, text: t }));
    return saved;
  } catch (e) {
    const m = e.message || String(e);
    if (m.includes('STALE')) { toast('别人刚改过这辆车，已刷新'); await load(true); S.open = S.cars.find(c => c.id === car.id) || null; render(); }
    else toast(m);
    return null;
  }
}

/* ---------- 登录 ---------- */
async function showLogin() {
  const staff = await call('staffNames');
  $('app').innerHTML = `<header><h1>TK168 交车看板</h1></header><main>
    <div class="card"><label>我是</label><select id="ln">${staff.map(s => `<option>${esc(s.name)}</option>`).join('')}</select>
    <label>PIN</label><input id="lp" type="password" inputmode="numeric" placeholder="4 位数字">
    <button class="btn" id="lb">登录</button><div class="err" id="le"></div>
    ${HAS_GAS ? '' : '<p class="m">本地演示模式：数据只存在这台设备上。PIN 例：小王 1111、老板 0000</p>'}</div></main>`;
  $('lb').onclick = async () => {
    const n = $('ln').value, p = $('lp').value.trim();
    if (!p) { $('le').textContent = '请先输入 PIN'; return; }
    try { S.me = await call('login', n, p); S.pin = p; pushLogin(n); try { localStorage.setItem('tk168me', JSON.stringify({ n, p })); } catch (e) {} await load(); }
    catch (e) { $('le').textContent = e.message || '登录失败'; }
  };
  $('lp').oninput = () => { $('le').textContent = ''; };
}

/* ---------- 渲染 ---------- */
function render() {
  if (S.edit) return renderEdit();
  if (S.open) return renderDetail();
  const tabs = [['board', '看板'], ['mine', '我的'], ['feed', '今日动态'], ['new', '＋新建']];
  let body = '';
  if (S.tab === 'board' || S.tab === 'mine') body = pushCard();
  if (S.tab === 'board') body += renderBoard();
  if (S.tab === 'mine') body += renderMine();
  if (S.tab === 'feed') body = renderFeed();
  $('app').innerHTML = `<header><h1>TK168 交车看板</h1><span>${esc(S.me.name)}</span><button id="rf">刷新</button><button id="lo">退出</button></header>
  <main>${body}</main>
  <nav>${tabs.map(t => `<button data-tab="${t[0]}" class="${S.tab === t[0] ? 'on' : ''}">${t[1]}</button>`).join('')}</nav>`;
  bindPush();
  $('rf').onclick = () => load().then(() => toast('已刷新'));
  $('lo').onclick = () => { try { localStorage.removeItem('tk168me'); } catch (e) {} pushLogout(); S.me = null; showLogin(); };
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
    if (b.dataset.tab === 'new') { S.edit = blankCar(); render(); return; }
    S.tab = b.dataset.tab; render();
  });
  document.querySelectorAll('[data-car]').forEach(el => el.onclick = () => { S.open = S.cars.find(c => c.id === el.dataset.car); render(); window.scrollTo(0, 0); });
  document.querySelectorAll('[data-f]').forEach(el => el.onclick = () => { S.filter = +el.dataset.f; render(); });
  const q = $('q'); if (q) q.oninput = () => { S.q = q.value; const p = q.selectionStart; render(); const n = $('q'); n.focus(); n.setSelectionRange(p, p); };
}

function carCard(c, extra) {
  const si = stageIdx(c);
  const keyWarn = c.keysMissing ? '<span class="badge b-red">缺钥匙</span>' : '';
  return `<div class="card" data-car="${esc(c.id)}">
    <div class="row"><span class="t">${esc(c.model)}</span>${dueBadge(c)}</div>
    <div class="m">${esc(c.customer || '—')} ｜ 销售 ${esc(c.sales || '—')} ｜ 事务 ${esc(c.owner || '—')}</div>
    <div class="m">交车日 ${esc(c.deliveryDate)} ${keyWarn}</div>
    <div class="steps">${STAGES.map((s, i) => `<div class="${i < si ? 'done' : i === si ? 'cur' : ''}"></div>`).join('')}</div>
    <div class="stl">${STAGES.map(s => `<span>${s.n}</span>`).join('')}</div>${extra || ''}</div>`;
}
function sorted(list) { return list.slice().sort((a, b) => (stageIdx(a) >= 5) - (stageIdx(b) >= 5) || a.deliveryDate.localeCompare(b.deliveryDate)); }

function renderBoard() {
  const counts = STAGES.map((s, i) => S.cars.filter(c => stageIdx(c) === i).length);
  const done = S.cars.filter(c => stageIdx(c) >= 5).length;
  const active = S.cars.length - done;
  let list = S.cars.filter(c => S.filter === -1 ? stageIdx(c) < 5 : stageIdx(c) === S.filter);
  if (S.q) { const q = S.q.toLowerCase(); list = list.filter(c => [c.model, c.customer, c.sales, c.owner, c.plate].join(' ').toLowerCase().includes(q)); }
  const chips = [[-1, `进行中 ${active}`]].concat(STAGES.map((s, i) => [i, `${s.n} ${counts[i]}`]), [[5, `已交车 ${done}`]]);
  return `<input id="q" placeholder="搜车型、客户、销售" value="${esc(S.q)}" style="margin-bottom:8px">
    <div class="chips">${chips.map(c => `<button class="chip ${S.filter === c[0] ? 'on' : ''}" data-f="${c[0]}">${c[1]}</button>`).join('')}</div>
    ${list.length ? sorted(list).map(c => carCard(c)).join('') : '<div class="empty">没有车辆。点下面的“＋新建”登记一辆。</div>'}`;
}

function renderMine() {
  const me = S.me.name;
  const mine = sorted(S.cars.filter(c => stageIdx(c) < 5 && (c.owner === me || c.sales === me || (S.me.role === '洗车' && stageIdx(c) === 3))));
  if (!mine.length) return '<div class="empty">目前没有你负责的车。</div>';
  return `<p class="m">你负责的车里，当前阶段还没做完的事：</p>` + mine.map(c => {
    const si = stageIdx(c);
    const todo = c.checklist[si].items.filter(x => !x.done).slice(0, 4);
    return carCard(c, `<div style="margin-top:8px">${todo.map(x => `<div class="m">· ${esc(x.t)}</div>`).join('')}</div>`);
  }).join('');
}

function renderFeed() {
  const t0 = today().getTime();
  const logs = S.logs.filter(l => l.ts >= t0).sort((a, b) => b.ts - a.ts);
  const cnt = {}; logs.forEach(l => { cnt[l.user] = (cnt[l.user] || 0) + 1; });
  const rows = S.staff.map(s => `<div class="row log"><span>${esc(s.name)} <span class="m">${esc(s.role)}</span></span>${cnt[s.name] ? `<span class="badge b-green">${cnt[s.name]} 次更新</span>` : '<span class="badge b-red">今天没更新</span>'}</div>`).join('');
  const overdue = S.cars.filter(c => stageIdx(c) < 5 && daysLeft(c) < 0);
  return `<div class="card"><div class="t" style="margin-bottom:6px">今天谁更新了</div>${rows}</div>
    ${overdue.length ? `<div class="card"><div class="t" style="color:#a32d2d">逾期 ${overdue.length} 台</div>${overdue.map(c => `<div class="log" data-car="${esc(c.id)}">${esc(c.model)}（${esc(c.customer || '')}）· ${stageName(stageIdx(c))} · 负责 ${esc(c.owner || '—')}</div>`).join('')}</div>` : ''}
    <div class="card"><div class="t" style="margin-bottom:6px">今日动态</div>${logs.length ? logs.slice(0, 80).map(l => `<div class="log" data-car="${esc(l.carId)}">${fmtT(l.ts)} <b>${esc(l.user)}</b> ${esc(l.car)}：${esc(l.text)}</div>`).join('') : '<div class="m">今天还没有更新。</div>'}</div>`;
}

function renderDetail() {
  const c = S.open; const si = stageIdx(c);
  const carLogs = S.logs.filter(l => l.carId === c.id).sort((a, b) => b.ts - a.ts).slice(0, 30);
  $('app').innerHTML = `<div class="sheet"><header><button id="bk">‹ 返回</button><h1>${esc(c.model)}</h1><button id="ed">编辑</button></header><div class="in">
    <div class="card"><div class="row"><span class="t">${esc(c.customer || '—')}</span>${dueBadge(c)}</div>
    <div class="m">交车日 ${esc(c.deliveryDate)} ｜ 签约 ${esc(c.contractDate || '—')}</div>
    <div class="m">销售 ${esc(c.sales || '—')} ｜ 事务 ${esc(c.owner || '—')} ｜ 管理号 ${esc(c.plate || '—')}</div>
    <div class="m">钥匙 ${esc(c.keys || '—')} 把</div>
    ${c.keysMissing ? '<div class="warn">缺钥匙，必须提前告知客户</div>' : ''}
    ${c.note ? `<div class="m" style="margin-top:6px;white-space:pre-wrap">备注：${esc(c.note)}</div>` : ''}
    <div class="steps">${STAGES.map((s, i) => `<div class="${i < si ? 'done' : i === si ? 'cur' : ''}"></div>`).join('')}</div>
    <div class="stl">${STAGES.map(s => `<span>${s.n}</span>`).join('')}</div></div>
    ${STAGES.map((s, i) => { const items = c.checklist[i].items; const n = items.filter(x => x.done).length;
      return `<div class="stage"><h3><span>${i + 1}. ${s.n}${i === si ? ' ← 当前' : ''}</span><span class="m">${n}/${items.length}</span></h3>
      ${items.map((x, j) => `<label class="item ${x.done ? 'ok' : ''}"><input type="checkbox" data-s="${i}" data-i="${j}" ${x.done ? 'checked' : ''}><div><div class="tx">${esc(x.t)}</div>${x.done ? `<div class="who">${esc(x.by)} · ${fmtT(x.at)}</div>` : ''}</div></label>`).join('')}</div>`; }).join('')}
    <div class="stage"><h3>操作记录</h3><div class="card">${carLogs.length ? carLogs.map(l => `<div class="log">${fmtT(l.ts)} <b>${esc(l.user)}</b> ${esc(l.text)}</div>`).join('') : '<div class="m">暂无</div>'}</div></div>
    </div></div>`;
  $('bk').onclick = () => { S.open = null; render(); };
  $('ed').onclick = () => { S.edit = JSON.parse(JSON.stringify(c)); render(); };
  document.querySelectorAll('[data-s]').forEach(cb => cb.onchange = async () => {
    if (S.busy) { cb.checked = !cb.checked; return; }
    S.busy = true;
    const car = JSON.parse(JSON.stringify(S.open));
    const before = stageIdx(car);
    const it = car.checklist[+cb.dataset.s].items[+cb.dataset.i];
    it.done = cb.checked;
    if (it.done) { it.by = S.me.name; it.at = Date.now(); } else { delete it.by; delete it.at; }
    const logs = [(it.done ? '完成「' : '取消「') + it.t + '」'];
    const after = stageIdx(car);
    if (after !== before) logs.push('进入阶段：' + stageName(after));
    const saved = await save(car, logs);
    S.busy = false;
    if (saved) { S.open = saved; render(); if (after >= 5 && before < 5) toast('已交车'); }
  });
}

function blankCar() { return { model: '', plate: '', customer: '', sales: '', owner: '', contractDate: new Date().toISOString().slice(0, 10), deliveryDate: '', keys: '2', keysMissing: false, reqs: [], note: '' }; }

function renderEdit() {
  const c = S.edit; const isNew = !c.id;
  const opts = (v, roles) => `<option value="">（未指定）</option>` + S.staff.filter(s => !roles || roles.includes(s.role)).map(s => `<option ${s.name === v ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
  $('app').innerHTML = `<div class="sheet"><header><button id="cx">取消</button><h1>${isNew ? '登记新车' : '编辑'}</h1></header><div class="in"><div class="card">
    <label>车型 <span class="req">*</span></label><input id="f_model" value="${esc(c.model)}" placeholder="例：奔驰 G400d 黑">
    <label>管理号 / 车架号</label><input id="f_plate" value="${esc(c.plate)}">
    <label>客户</label><input id="f_customer" value="${esc(c.customer)}">
    <label>负责销售</label><select id="f_sales">${opts(c.sales)}</select>
    <label>事务负责</label><select id="f_owner">${opts(c.owner, ['事务', '管理'])}</select>
    <label>签约日</label><input id="f_contract" type="date" value="${esc(c.contractDate)}">
    <label>交车日 <span class="req">*</span></label><input id="f_delivery" type="date" value="${esc(c.deliveryDate)}">
    <label>钥匙数量</label><select id="f_keys">${['1', '2', '3'].map(k => `<option ${String(c.keys) === k ? 'selected' : ''}>${k}</option>`).join('')}</select>
    <label class="item" style="margin-top:10px"><input id="f_km" type="checkbox" ${c.keysMissing ? 'checked' : ''}><div>缺钥匙（会标红提醒）</div></label>
    <label>客户加装 / 需求（一行一条，自动加进整备清单）</label><textarea id="f_reqs" rows="4" placeholder="例：加雨眉&#10;装行车记录仪&#10;换轮胎">${esc((c.reqs || []).join('\n'))}</textarea>
    <label>备注</label><textarea id="f_note" rows="3">${esc(c.note)}</textarea>
    <div class="err" id="fe"></div>
    <button class="btn" id="sv">${isNew ? '登记' : '保存'}</button></div></div></div>`;
  $('cx').onclick = () => { S.edit = null; render(); };
  ['f_model', 'f_delivery'].forEach(id => $(id).oninput = () => { $('fe').textContent = ''; });
  $('sv').onclick = async () => {
    const v = id => $(id).value.trim();
    if (!v('f_model')) { $('fe').textContent = '请填写车型'; return; }
    if (!v('f_delivery')) { $('fe').textContent = '请填写交车日'; return; }
    const car = JSON.parse(JSON.stringify(c));
    const old = JSON.parse(JSON.stringify(c));
    Object.assign(car, { model: v('f_model'), plate: v('f_plate'), customer: v('f_customer'), sales: v('f_sales'), owner: v('f_owner'), contractDate: v('f_contract'), deliveryDate: v('f_delivery'), keys: v('f_keys'), keysMissing: $('f_km').checked, note: $('f_note').value.trim(), reqs: $('f_reqs').value.split('\n').map(s => s.trim()).filter(Boolean) });
    const logs = [];
    if (isNew) { car.checklist = newChecklist(car.reqs); logs.push('登记新车，交车日 ' + car.deliveryDate); }
    else {
      syncReqs(car);
      const L = { model: '车型', plate: '管理号', customer: '客户', sales: '销售', owner: '事务负责', contractDate: '签约日', deliveryDate: '交车日', keys: '钥匙', note: '备注' };
      Object.keys(L).forEach(k => { if (String(old[k] || '') !== String(car[k] || '')) logs.push(`${L[k]}：${old[k] || '空'} → ${car[k] || '空'}`); });
      if (!!old.keysMissing !== car.keysMissing) logs.push(car.keysMissing ? '标记缺钥匙' : '取消缺钥匙');
      if ((old.reqs || []).join('|') !== car.reqs.join('|')) logs.push('需求改为：' + (car.reqs.join('、') || '无'));
      if (!logs.length) { S.edit = null; render(); return; }
    }
    $('sv').disabled = true;
    const saved = await save(car, logs);
    if (!saved) { $('sv').disabled = false; return; }
    S.edit = null; S.open = saved; render(); toast(isNew ? '已登记' : '已保存');
  };
}

/* ---------- 启动 ---------- */
(async () => {
  let saved = null; try { saved = JSON.parse(localStorage.getItem('tk168me')); } catch (e) {}
  if (saved) {
    try { S.me = await call('login', saved.n, saved.p); S.pin = saved.p; pushLogin(saved.n); await load(); }
    catch (e) { showLogin(); }
  } else showLogin();
  setInterval(() => { if (S.me && !S.busy && !document.hidden) load(true); }, 30000);
})();
</script>
